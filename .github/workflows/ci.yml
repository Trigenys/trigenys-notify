name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Validate scoped VPS operator
        run: python3 -m unittest discover -s test/vps -v
      - name: Check one-shot WhatsApp smoke runner (mock only)
        run: node scripts/waha-smoke.mjs --mock
      - name: Validate Cloudflare Worker bundle
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check

