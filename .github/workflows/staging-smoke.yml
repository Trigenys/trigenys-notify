name: Staging smoke — Trigenys Notify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify deployed Mini App with no credentials and no writes
        run: node scripts/staging-smoke.mjs
